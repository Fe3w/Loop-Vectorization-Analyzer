<text x='177.0' y='176.5' font-size='12' text-anchor='start' font-weight='400' fill='#52514e' font-family='system-ui, -apple-system, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif'>GCC misses, same reason</text>
