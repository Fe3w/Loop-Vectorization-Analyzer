<text x='564.1' y='106.0' font-size='13' text-anchor='start' font-weight='600' fill='#0b0b0b' font-family='system-ui, -apple-system, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif'>7 of 78</text>
