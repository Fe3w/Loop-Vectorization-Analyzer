<text x='28.0' y='203.0' font-size='11' text-anchor='start' font-weight='400' fill='#52514e' font-family='system-ui, -apple-system, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif'>Most are floating-point sums (PolyBench 7 of 7, TSVC 15 of 20). GCC keeps the source order; on x86, LLVM needs -ffast-math.</text>
