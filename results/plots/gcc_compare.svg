<text x='28.0' y='48.0' font-size='18' text-anchor='start' font-weight='600' fill='#0b0b0b' font-family='system-ui, -apple-system, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif'>GCC 13 on loops LLVM 20 left scalar</text>
<text x='28.0' y='72.0' font-size='12' text-anchor='start' font-weight='400' fill='#52514e' font-family='system-ui, -apple-system, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif'>x86-64, -O3.</text>
